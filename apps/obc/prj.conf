# SPDX-License-Identifier: Apache-2.0

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
CONFIG_FINCH_CSP=y
CONFIG_FINCH_CSP_NODE_ADDRESS=1
CONFIG_FINCH_CSP_HOSTNAME="obc"
CONFIG_FINCH_CSP_CAN=y

# CSP CAN driver allocates its per-interface context from the system heap
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Configure UART as logging backend
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_WATCHDOG=y
CONFIG_UART_CONSOLE=y
CONFIG_IWDG_STM32=y
CONFIG_WDT_DISABLE_AT_BOOT=y

# Configure min/max watchdog window size
CONFIG_WDT_MAX_WINDOW=1000
CONFIG_WDT_MIN_WINDOW=0
CONFIG_WDT_OPT=0

# Configure watchdog check interval
CONFIG_WDT_CHECK_INTERVAL=100

CONFIG_CAN=y

# ADCS UART
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_FINCH_ADCS=y
