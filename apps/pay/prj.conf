# SPDX-License-Identifier: Apache-2.0

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

# libcsp supplies addressing, ports, routing, and services. Raw CAN transport
# still needs to be attached separately in the FINCH CSP integration library.
CONFIG_FINCH_CSP=y
CONFIG_FINCH_CSP_NODE_ADDRESS=2
CONFIG_FINCH_CSP_HOSTNAME="pay"

# Configure UART as logging backend
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Capture RGB565 frames from the OV7670 through DCMI.
CONFIG_I2C=y
CONFIG_DMA=y
CONFIG_VIDEO=y
CONFIG_VIDEO_STM32_DCMI=y
CONFIG_VIDEO_OV7670=y
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=153600
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2

# Store captured frames on the FAT-formatted SD card through SDMMC1.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
